{% extends 'base.html' %}
{% block title %}Create account | RetailFlow{% endblock %}
{% block content %}
<section class="surface form-shell"><p class="eyebrow">Start fresh</p><h1>Create your account.</h1>
    {% if error %}<div class="flash">{{ error }}</div>{% endif %}
    <form action="" method="POST">
        {% csrf_token %}
        <div class="form-grid"><div class="field"><label>Username</label><input type="text" name="username" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Password</label><input type="password" name="password" required></div><div class="field"><label>Confirm password</label><input type="password" name="confirm_password" required></div></div>
        <div class="form-actions"><button class="button" type="submit">Create account</button><a class="button-link" href="{% url 'login' %}">Already a member?</a></div>
    </form>
</section>
{% endblock %}

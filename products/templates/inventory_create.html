<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Create Inventory</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Product:</label>
        <select name="product" required>
            {% for product in products %}
                <option value="{{ product.id }}">{{ product.name }}</option>
            {% endfor %}
        </select>
        <br><br>

        <label>Stock Quantity:</label><input type="number" name="stock_quantity" min="0" required><br><br>
        <label>Reorder Level:</label><input type="number" name="reorder_level" min="0" required><br><br>

        <button type="submit">Create Inventory</button>
    </form>
</body>
</html>

{% extends 'base.html' %}
{% block title %}Assign supplier | RetailFlow{% endblock %}
{% block content %}
<section class="surface form-shell">
    <p class="eyebrow">Partners</p>
    <h1>Assign a supplier.</h1>

    {% if error %}
        <div class="flash">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-grid">
            <div class="field">
                <label>Product</label>
                <select name="product" required>
                    {% for product in products %}
                        <option value="{{ product.id }}">{{ product.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label>Supplier</label>
                <select name="supplier" required>
                    {% for supplier in suppliers %}
                        <option value="{{ supplier.id }}">{{ supplier.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label>Supply price</label>
                <input type="number" name="supply_price" min="0" step="0.01" required>
            </div>
        </div>

        <div class="form-actions">
            <button class="button" type="submit">Assign supplier</button>
            <a class="button-link" href="{% url 'supplier_list' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Product - RetailFlow</title>
</head>

<body>
    <h1>Edit Product</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Name:</label>
        <input type="text" name="name" value="{{ product.name }}" required ><br><br>

        <label>Description:</label>
        <textarea name="desc">{{ product.desc}}</textarea><br><br>

        <label>Category:</label>
        <select name="category" required>
            {% for category in categories %}
                <option value="{{ category.id }}" {% if category.id == product.category.id %}selected{% endif %} >{{ category.name }}</option>
            {% endfor %}
        </select>
        <br><br>

        <label>Cost Price:</label>
        <input type="number" step="0.01" name="mrp" value="{{ product.mrp}}" required ><br><br>

        <label>Selling Price:</label>
        <input type="number" step="0.01" name="selling_price" value="{{ product.selling_price }}" required ><br><br>

        <button type="submit">Update Product</button>
    </form>

</body>
</html>

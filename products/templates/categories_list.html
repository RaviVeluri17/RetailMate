{% extends 'base.html' %}{% block title %}Categories | RetailFlow{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">Catalog structure</p><h1>Categories.</h1></div><a class="button" href="{% url 'category_create' %}">Add category</a></div><section class="surface table-wrap"><table><thead><tr><th>#</th><th>Name</th><th></th></tr></thead><tbody>
    {% for i in category %}
        <tr><td>{{forloop.counter}}</td><td><strong>{{i.name}}</strong></td><td><a class="button-link" href="{% url 'category_update' i.id %}">Edit ↗</a></td></tr>
    {% empty %}
    <tr><td colspan="3">No categories available.</td></tr>
    {% endfor %}
</tbody></table></section>{% endblock %}

{% extends 'base.html' %}
{% block title %}Edit category | RetailFlow{% endblock %}
{% block content %}

<section class="surface form-shell">
    <p class="eyebrow">Catalog structure</p>
    <h1>Edit category.</h1>
    {% if error %}
        <div class="flash">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="field">
            <label>Category name</label>
            <input type="text" name="name" value="{{ category.name }}" required >
        </div>

        <div class="field">
            <label>Description</label><textarea name="description" required>{{ category.description }}</textarea>
        </div>

        <div class="form-actions">
            <button class="button" type="submit">Save changes</button>
            <a class="button-link" href="{% url 'category_list' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}

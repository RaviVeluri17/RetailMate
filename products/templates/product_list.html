{% extends 'base.html' %}{% block title %}Products | RetailFlow{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">Catalog</p><h1>Products.</h1></div><a class="button" href="{% url 'cart' %}">View cart</a></div><div class="grid product-grid">{% for i in products %}<article class="surface card"><p class="card-kicker">{{ i.category.name }}</p><h3>{{ i.name }}</h3><p>{{ i.desc }}</p><div class="summary-row"><span class="price">₹{{ i.selling_price }}</span><a class="button-link" href="{% url 'product_details' i.id %}">View ↗</a></div></article>{% empty %}<div class="surface empty-state"><h2>No products yet.</h2></div>{% endfor %}</div>{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Create Product</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label><input type="text" name="name" required><br><br>
        <label>Description:</label><textarea name="desc"></textarea><br><br>
        <label>Category:</label>
        <select name="category" required>
            {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
        </select>
        <br><br>
        <label>Cost Price:</label><input type="number" step="0.01" name="mrp" required><br><br>
        <label>Selling Price:</label><input type="number" step="0.01" name="selling_price" required><br><br>

        <button type="submit">Create Product</button>
    </form>
</body>
</html>

{% extends 'base.html' %}
{% block title %}Checkout | RetailFlow{% endblock %}
{% block content %}
<section class="surface form-shell"><p class="eyebrow">Final check</p><h1>Ready to place<br>your order?</h1><p>Once placed, your order will appear in your order history so you can follow its progress.</p>
    <form method="POST">
        {% csrf_token %}
        <div class="form-actions"><button class="button" type="submit">Place order <span>↗</span></button><a class="button-link" href="{% url 'cart' %}">Back to cart</a></div>
    </form>
    </section>
{% endblock %}
